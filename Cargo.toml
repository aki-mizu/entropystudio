[package]
name = "entropystudio-ffi"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "UniFFI bindings for EntropyLab operations in EntropyStudio"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
base64 = "=0.22.1"
bc-lifehash = "0.1.0"
entropylab-wasm = { path = "entropylab/entropylab-wasm" }
hex = "=0.4.3"
miniscript = { version = "=13.1.0", default-features = false, features = ["std"] }
png = "=0.17.16"
uniffi = "=0.31.2"
unicode-normalization = "=0.1.24"
